name: Reader quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reader and speech lifecycle regression
        run: node --test tests/reader.test.cjs
