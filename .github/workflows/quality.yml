name: Reader quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reader and speech lifecycle regression
        run: node --test tests/reader.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Rendered recovery flow with synthetic speech
        run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-browser-quality
          path: test-results/
