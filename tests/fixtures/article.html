<head><meta charset="utf-8"><title>Short article fixture</title></head>
<body>
<nav>Navigation should not become listening text.</nav>
<main><article><h1>A short passage</h1><p>One clear sentence.</p><p>Another paragraph.</p></article></main>
<footer>Footer content should not become listening text even when it is longer than the article itself.</footer>
